<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Phân Tích Đường Ống Cấp Nước HueWACO</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar {
            width: 360px;
            background: #f8f9fa;
            border-right: 1px solid #ccc;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        
        h2 { font-size: 18px; color: #0056b3; margin-bottom: 5px; }
        .filter-group { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
        .filter-group label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        select, input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; margin-bottom: 5px; }
        
        .stat-card {
            background: #e9ecef;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
        }
        .stat-val { font-size: 15px; font-weight: bold; color: #28a745; }
        
        #map { flex: 1; height: 100%; }
        #loading { display: none; color: #d9534f; font-size: 12px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>🚰 Quản Lý Đường Ống HueWACO</h2>
        
        <div class="filter-group">
            <label>📂 Tải file GeoJSON:</label>
            <input type="file" id="geojson-file" accept=".geojson, .json">
            <div id="loading">⏳ Đang xử lý dữ liệu lớn, vui lòng đợi...</div>
        </div>

        <div class="filter-group">
            <label>🔍 Tìm kiếm (Mã ống / Tên đường):</label>
            <input type="text" id="search-input" placeholder="Nhập từ khóa...">
        </div>

        <div class="filter-group">
            <label>🛠️ Lọc theo Chất liệu:</label>
            <select id="material-filter">
                <option value="ALL">-- Tất cả vật liệu --</option>
            </select>

            <label>📏 Lọc theo Đường kính (DN):</label>
            <select id="diameter-filter">
                <option value="ALL">-- Tất cả kích thước --</option>
            </select>
        </div>

        <div class="filter-group">
            <label>📊 Thống kê mạng lưới:</label>
            <div class="stat-card">
                <span>Tổng số đoạn ống:</span>
                <span id="stat-count" class="stat-val">0</span>
            </div>
            <div class="stat-card">
                <span>Tổng chiều dài:</span>
                <span id="stat-length" class="stat-val">0 m</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Khởi tạo Bản đồ Leaflet (Trung tâm Thừa Thiên Huế)
        const map = L.map('map').setView([16.4637, 107.5909], 13);

        const googleSatellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google Maps'
        });

        const googleStreets = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: '&copy; Google Maps'
        });

        googleSatellite.addTo(map);
        L.control.layers({"Google Vệ tinh": googleSatellite, "Google Đường phố": googleStreets}).addTo(map);

        let currentData = null;
        let geojsonLayer = null;

        // 2. Hàm đọc giá trị thuộc tính linh hoạt (Tránh lỗi khác tên cột)
        function getPropValue(props, keys) {
            if (!props) return null;
            for (let k of Object.keys(props)) {
                for (let targetKey of keys) {
                    if (k.toLowerCase() === targetKey.toLowerCase()) return props[k];
                }
            }
            return null;
        }

        function getMaterial(props) {
            return getPropValue(props, ['chat_lieu', 'material', 'vat_lieu', 'chatlieu', 'mat']) || 'Khác';
        }

        function getDiameter(props) {
            return getPropValue(props, ['duong_kinh', 'diameter', 'dn', 'duongkinh', 'size']) || 0;
        }

        function getLength(props) {
            return getPropValue(props, ['chieu_dai', 'length', 'lenght', 'chieudai', 'shape_leng', 'st_length']) || 0;
        }

        function getCode(props) {
            return getPropValue(props, ['ma_ong', 'id', 'code', 'maong', 'objectid']) || 'N/A';
        }

        function getStreet(props) {
            return getPropValue(props, ['ten_duong', 'street', 'tenduong', 'road', 'location']) || 'N/A';
        }

        function getColor(mat) {
            const m = String(mat).toUpperCase();
            if (m.includes('HDPE')) return '#007bff';
            if (m.includes('PVC')) return '#28a745';
            if (m.includes('GANG') || m.includes('CI') || m.includes('DI')) return '#dc3545';
            if (m.includes('THÉP') || m.includes('STEEL')) return '#ffc107';
            return '#6c757d';
        }

        // 3. Hiển thị dữ liệu lên bản đồ
        function renderMap(data) {
            if (geojsonLayer) { map.removeLayer(geojsonLayer); }

            let totalLength = 0;
            let count = 0;

            geojsonLayer = L.geoJSON(data, {
                style: function(feature) {
                    const d = getDiameter(feature.properties);
                    const mat = getMaterial(feature.properties);
                    return {
                        color: getColor(mat),
                        weight: Math.max(2, Math.min(d / 40, 8)),
                        opacity: 0.85
                    };
                },
                onEachFeature: function(feature, layer) {
                    const props = feature.properties;
                    const code = getCode(props);
                    const street = getStreet(props);
                    const mat = getMaterial(props);
                    const dia = getDiameter(props);
                    const len = getLength(props);

                    layer.bindPopup(`
                        <div style="font-size:13px;">
                            <b style="color:#0056b3;">Mã ống: ${code}</b><br>
                            <b>Tên đường:</b> ${street}<br>
                            <b>Chất liệu:</b> ${mat}<br>
                            <b>Đường kính (DN):</b> ${dia} mm<br>
                            <b>Chiều dài:</b> ${parseFloat(len).toFixed(1)} m
                        </div>
                    `);

                    totalLength += parseFloat(len) || 0;
                    count++;
                }
            }).addTo(map);

            document.getElementById('stat-count').innerText = count.toLocaleString('vi-VN');
            document.getElementById('stat-length').innerText = totalLength.toLocaleString('vi-VN', {maximumFractionDigits: 1}) + " m";

            if (count > 0) {
                try {
                    map.fitBounds(geojsonLayer.getBounds());
                } catch(e) {}
            }
        }

        // 4. Tạo bộ lọc
        function initFilters(data) {
            const matSelect = document.getElementById('material-filter');
            const diaSelect = document.getElementById('diameter-filter');

            let mats = new Set();
            let dias = new Set();

            data.features.forEach(f => {
                const m = getMaterial(f.properties);
                const d = getDiameter(f.properties);
                if (m) mats.add(m);
                if (d) dias.add(Number(d));
            });

            matSelect.innerHTML = '<option value="ALL">-- Tất cả vật liệu --</option>';
            Array.from(mats).sort().forEach(m => matSelect.innerHTML += `<option value="${m}">${m}</option>`);

            diaSelect.innerHTML = '<option value="ALL">-- Tất cả kích thước --</option>';
            Array.from(dias).sort((a,b)=>a-b).forEach(d => diaSelect.innerHTML += `<option value="${d}">${d} mm</option>`);
        }

        // 5. Lọc dữ liệu
        function filterData() {
            if (!currentData) return;
            const searchKw = document.getElementById('search-input').value.toLowerCase();
            const matVal = document.getElementById('material-filter').value;
            const diaVal = document.getElementById('diameter-filter').value;

            const filteredFeatures = currentData.features.filter(f => {
                const props = f.properties;
                const code = String(getCode(props)).toLowerCase();
                const street = String(getStreet(props)).toLowerCase();
                const mat = String(getMaterial(props));
                const dia = String(getDiameter(props));

                const matchSearch = code.includes(searchKw) || street.includes(searchKw);
                const matchMat = (matVal === 'ALL') || (mat === matVal);
                const matchDia = (diaVal === 'ALL') || (dia === diaVal);

                return matchSearch && matchMat && matchDia;
            });

            renderMap({ "type": "FeatureCollection", "features": filteredFeatures });
        }

        document.getElementById('search-input').addEventListener('input', filterData);
        document.getElementById('material-filter').addEventListener('change', filterData);
        document.getElementById('diameter-filter').addEventListener('change', filterData);

        // 6. Đọc file GeoJSON người dùng tải lên
        document.getElementById('geojson-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            const reader = new FileReader();
            reader.onload = function(evt) {
                setTimeout(() => {
                    try {
                        let text = evt.target.result;
                        
                        // Xóa các ký tự BOM nhiễu nếu có
                        if (text.charCodeAt(0) === 0xFEFF) {
                            text = text.substr(1);
                        }

                        currentData = JSON.parse(text);

                        if (!currentData.type || currentData.type !== "FeatureCollection") {
                            throw new Error("File JSON không có cấu trúc FeatureCollection chuẩn.");
                        }

                        initFilters(currentData);
                        renderMap(currentData);
                        loading.style.display = 'none';
                    } catch (err) {
                        loading.style.display = 'none';
                        alert("Lỗi đọc file: " + err.message + "\n\nHướng xử lý: Hãy kiểm tra xem file .geojson có bị hỏng cấu trúc cú pháp JSON hay không.");
                    }
                }, 50);
            };

            reader.readAsText(file, "UTF-8");
        });
    </script>
</body>
</html>
